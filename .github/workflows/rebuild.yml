name: Rebuild & Warm Cache

on:
  schedule:
    # 08:00 BRT = 11:00 UTC
    - cron: '0 11 * * *'
    # 14:00 BRT = 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  rebuild-and-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP %{http_code}\n"

      - name: Wait for build to complete
        run: sleep 120

      - name: Warm today's and tomorrow's cache
        env:
          SITE_URL: https://hojetemjogo.com.br
        run: |
          TODAY=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          TOMORROW=$(TZ=America/Sao_Paulo date -d "tomorrow" +%Y-%m-%d)

          echo "Warming /dia/$TODAY"
          curl -s -o /dev/null -w "Today: HTTP %{http_code}\n" "$SITE_URL/dia/$TODAY"

          echo "Warming /dia/$TOMORROW"
          curl -s -o /dev/null -w "Tomorrow: HTTP %{http_code}\n" "$SITE_URL/dia/$TOMORROW"
